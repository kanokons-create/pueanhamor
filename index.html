<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เพื่อนหาหมอ - บริการพาผู้ป่วยและผู้สูงอายุไปโรงพยาบาล</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --accent-color: #0d9488;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success-color: #16a34a;
      --success-bg: #dcfce7;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.03);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      padding: 24px 16px;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 300;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: white;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .nav-btn {
      flex: 1;
      max-width: 200px;
      padding: 14px 12px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 3px solid transparent;
    }

    .nav-btn:hover {
      color: var(--primary-color);
      background-color: #f8fafc;
    }

    .nav-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-interactive:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 6px;
      color: #334155;
    }

    input, select, textarea {
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      font-size: 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      background-color: white;
      color: var(--text-main);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
    }

    .btn:hover {
      background-color: var(--primary-dark);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
      color: var(--text-main);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background-color: #f1f5f9;
      color: var(--text-muted);
    }

    .badge-verified {
      background-color: var(--success-bg);
      color: var(--success-color);
    }

    .stats-bar {
      background-color: var(--primary-light);
      border: 1px solid #bae6fd;
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--primary-dark);
      text-align: center;
      font-weight: 500;
    }

    .provider-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .provider-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-light);
    }

    .provider-info h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .provider-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .provider-details {
        grid-template-columns: 1fr;
      }
    }

    .detail-item {
      color: var(--text-muted);
    }

    .detail-item strong {
      color: var(--text-main);
    }

    .price-tag {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary-color);
    }

    .status-box {
      padding: 12px 16px;
      border-radius: 8px;
      background-color: #f8fafc;
      border: 1px dashed var(--border-color);
      margin-top: 12px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      gap: 12px;
    }

    .pagination button {
      flex: 1;
      padding: 10px;
      background-color: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-main);
      transition: background-color 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      background-color: #f8fafc;
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary-color);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 24px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>เพื่อนหาหมอ 🩺</h1>
    <p>บริการผู้ช่วยพาไปโรงพยาบาล & เฝ้าไข้ ครอบคลุม รพ.ประจำอำเภอ ทุกแห่งทั่วไทย</p>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('search')">ค้นหาผู้ดูแล</button>
    <button class="nav-btn" onclick="switchTab('orders')">สถานะการจอง</button>
    <button class="nav-btn" onclick="switchTab('register')">ลงทะเบียนบริการ</button>
  </nav>

  <div class="container">

    <!-- 1. หน้าค้นหาผู้ดูแล -->
    <div id="tab-search" class="tab-content">
      <div class="card">
        <h2>🔍 ค้นหาผู้ดูแล</h2>
        <div class="form-group">
          <label for="search-province">เลือกจังหวัด</label>
          <select id="search-province" onchange="onProvinceChange('search')">
            <option value="all">-- ทุกจังหวัด --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="search-district">เลือกเขต / อำเภอ</label>
          <select id="search-district" onchange="onDistrictChange('search')">
            <option value="all">-- ทุกเขต/อำเภอ --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="search-subdistrict">เลือกแขวง / ตำบล</label>
          <select id="search-subdistrict" onchange="filterServices(1)">
            <option value="all">-- ทุกแขวง/ตำบล --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="search-hospital">เลือกโรงพยาบาล (รวม รพ.ศูนย์ และ รพ.ประจำอำเภอ)</label>
          <select id="search-hospital" onchange="filterServices(1)">
            <option value="all">-- ทุกโรงพยาบาล --</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="service-type">ประเภทบริการ</label>
          <select id="service-type" onchange="filterServices(1)">
            <option value="all">ทั้งหมด</option>
            <option value="transport">พาไปโรงพยาบาล (ครึ่งวัน/เต็มวัน)</option>
            <option value="overnight">เฝ้าไข้นอนโรงพยาบาล (รายวัน)</option>
          </select>
        </div>
      </div>

      <div id="stats-info" class="stats-bar hidden"></div>
      <div id="loading" class="loader hidden"></div>
      <div id="service-list"></div>
      <div id="pagination-controls" class="pagination hidden"></div>
    </div>

    <!-- 2. หน้าติดตามสถานะการจอง -->
    <div id="tab-orders" class="tab-content hidden">
      <h2>📋 รายการจองของคุณ</h2>
      <div id="orders-list"></div>
    </div>

    <!-- 3. หน้าลงทะเบียนให้บริการ -->
    <div id="tab-register" class="tab-content hidden">
      <div class="card">
        <h2>📝 ลงทะเบียนเป็นผู้ดูแล</h2>
        <form id="provider-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="p-name">ชื่อ - นามสกุล *</label>
            <input type="text" id="p-name" required placeholder="นาย/นาง/นางสาว...">
          </div>
          <div class="form-group">
            <label for="p-phone">เบอร์โทรศัพท์ (สำหรับ OTP) *</label>
            <input type="tel" id="p-phone" required placeholder="08X-XXX-XXXX">
          </div>
          <div class="form-group">
            <label for="p-role">คุณสมบัติ/วิชาชีพ *</label>
            <select id="p-role" required>
              <option value="ผู้ช่วยพยาบาล (NA/PN)">ผู้ช่วยพยาบาล (NA/PN)</option>
              <option value="พยาบาลวิชาชีพ (RN)">พยาบาลวิชาชีพ (RN)</option>
              <option value="บุคคลทั่วไปผ่านการอบรม">บุคคลทั่วไปผ่านการอบรมผู้ดูแล</option>
            </select>
          </div>
          <div class="form-group">
            <label for="p-license">เลขที่ใบประกอบวิชาชีพ / ใบรับรอง</label>
            <input type="text" id="p-license" placeholder="ระบุเลขที่เอกสาร (ถ้ามี)">
          </div>
          <div class="form-group">
            <label for="reg-province">จังหวัดที่รับดูแล *</label>
            <select id="reg-province" required onchange="onProvinceChange('reg')">
              <option value="">-- เลือกจังหวัด --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-district">เขต / อำเภอที่รับดูแล *</label>
            <select id="reg-district" required onchange="onDistrictChange('reg')">
              <option value="">-- เลือกเขต/อำเภอ --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-subdistrict">แขวง / ตำบลที่สะดวกประจำ *</label>
            <select id="reg-subdistrict" required>
              <option value="">-- เลือกแขวง/ตำบล --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-hospital">โรงพยาบาลประจำ/รับส่งประจำ *</label>
            <select id="reg-hospital" required>
              <option value="">-- เลือกโรงพยาบาล --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="p-service">ลักษณะการให้บริการ *</label>
            <select id="p-service" required>
              <option value="transport">พาไปโรงพยาบาล</option>
              <option value="overnight">เฝ้าไข้นอนโรงพยาบาล</option>
              <option value="both">ทำได้ทั้งสองอย่าง</option>
            </select>
          </div>
          <div class="form-group">
            <label for="p-price">อัตราค่าบริการ (บาท) *</label>
            <input type="number" id="p-price" required placeholder="เช่น 800 บาท/ครั้ง หรือ 1500 บาท/วัน">
          </div>
          <button type="submit" class="btn">ลงประกาศให้บริการ</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    // 1. โครงสร้างข้อมูล จังหวัด -> อำเภอ -> ตำบล และ โรงพยาบาลประจำอำเภอ
    const locationHierarchy = {
      "กรุงเทพมหานคร": {
        hospitals: ["โรงพยาบาลศิริราช", "โรงพยาบาลจุฬาลงกรณ์", "โรงพยาบาลรามาธิบดี", "โรงพยาบาลพระมงกุฎเกล้า", "โรงพยาบาลราชวิถี", "โรงพยาบาลตำรวจ", "โรงพยาบาลกรุงเทพ", "โรงพยาบาลพญาไท"],
        districts: {
          "เขตบางกอกน้อย": { subdistricts: ["แขวงศิริราช", "แขวงบ้านช่างหล่อ", "แขวงบางกอกน้อย"], hosp: "โรงพยาบาลศิริราช" },
          "เขตพระนคร": { subdistricts: ["แขวงพระบรมมหาราชวัง", "แขวงวัดบวรนิเวศ", "แขวงชนะสงคราม"], hosp: "โรงพยาบาลพระมงกุฎเกล้า" },
          "เขตปทุมวัน": { subdistricts: ["แขวงลุมพินี", "แขวงปทุมวัน", "แขวงรองเมือง"], hosp: "โรงพยาบาลจุฬาลงกรณ์" },
          "เขตพญาไท": { subdistricts: ["แขวงพญาไท", "แขวงสามเสนใน"], hosp: "โรงพยาบาลรามาธิบดี" },
          "เขตราชเทวี": { subdistricts: ["แขวงทุ่งพญาไท", "แขวงถนนเพชรบุรี"], hosp: "โรงพยาบาลราชวิถี" }
        }
      },
      "เชียงใหม่": {
        hospitals: ["โรงพยาบาลมหาราชนครเชียงใหม่ (สวนดอก)", "โรงพยาบาลนครพิงค์"],
        districts: {
          "อ.เมืองเชียงใหม่": { subdistricts: ["ตำบลสุเทพ", "ตำบลช้างเผือก", "ตำบลศรีภูมิ", "ตำบลหนองหอย"], hosp: "โรงพยาบาลมหาราชนครเชียงใหม่" },
          "อ.สันทราย": { subdistricts: ["ตำบลสันทรายน้อย", "ตำบลสันทรายหลวง", "ตำบลหนองจ๊อม"], hosp: "โรงพยาบาลสันทราย" },
          "อ.หางดง": { subdistricts: ["ตำบลหางดง", "ตำบลหนองแก๋ว", "ตำบลน้ำแพร่"], hosp: "โรงพยาบาลหางดง" },
          "อ.ฝาง": { subdistricts: ["ตำบลเวียง", "ตำบลแม่สูน", "ตำบลสันทราย"], hosp: "โรงพยาบาลฝาง" }
        }
      },
      "พิษณุโลก": {
        hospitals: ["โรงพยาบาลพุทธชินราช", "โรงพยาบาลมหาวิทยาลัยนเรศวร"],
        districts: {
          "อ.เมืองพิษณุโลก": { subdistricts: ["ตำบลในเมือง", "ตำบลพลายชุมพล", "ตำบลอรัญญิก", "ตำบลสมอแข"], hosp: "โรงพยาบาลพุทธชินราช" },
          "อ.วังทอง": { subdistricts: ["ตำบลวังทอง", "ตำบลวังนกแอ่น", "ตำบลแก่งโสภา"], hosp: "โรงพยาบาลวังทอง" },
          "อ.บางระกำ": { subdistricts: ["ตำบลบางระกำ", "ตำบลปลวกสูง", "ตำบลบึงกอก"], hosp: "โรงพยาบาลบางระกำ" },
          "อ.นครไทย": { subdistricts: ["ตำบลนครไทย", "ตำบลบ้านแยง", "ตำบลเนินเพิ่ม"], hosp: "โรงพยาบาลนครไทย" }
        }
      },
      "ขอนแก่น": {
        hospitals: ["โรงพยาบาลศรีนครินทร์ (มข.)", "โรงพยาบาลขอนแก่น"],
        districts: {
          "อ.เมืองขอนแก่น": { subdistricts: ["ตำบลในเมือง", "ตำบลศิลา", "ตำบลบ้านเป็ด"], hosp: "โรงพยาบาลขอนแก่น" },
          "อ.ชุมแพ": { subdistricts: ["ตำบลชุมแพ", "ตำบลหนองไผ่", "ตำบลไชยสอ"], hosp: "โรงพยาบาลชุมแพ" },
          "อ.น้ำพอง": { subdistricts: ["ตำบลน้ำพอง", "ตำบลหนองกุง", "ตำบลกุดน้ำใส"], hosp: "โรงพยาบาลน้ำพอง" }
        }
      },
      "ชลบุรี": {
        hospitals: ["โรงพยาบาลชลบุรี", "โรงพยาบาลสมเด็จพระบรมราชเทวี ณ ศรีราชา"],
        districts: {
          "อ.เมืองชลบุรี": { subdistricts: ["ตำบลแสนสุข", "ตำบลเสม็ด", "ตำบลบางปลาหมอ"], hosp: "โรงพยาบาลชลบุรี" },
          "อ.ศรีราชา": { subdistricts: ["ตำบลศรีราชา", "ตำบลสุรศักดิ์", "ตำบลบ่อวิน"], hosp: "โรงพยาบาลสมเด็จพระบรมราชเทวี ณ ศรีราชา" },
          "อ.บางละมุง": { subdistricts: ["ตำบลหนองปรือ", "ตำบลนาเกลือ", "ตำบลห้วยใหญ่"], hosp: "โรงพยาบาลบางละมุง" }
        }
      },
      "สงขลา": {
        hospitals: ["โรงพยาบาลสงขลานครินทร์ (ม.อ.)", "โรงพยาบาลหาดใหญ่"],
        districts: {
          "อ.หาดใหญ่": { subdistricts: ["ตำบลหาดใหญ่", "ตำบลคลองแห", "ตำบลควนลัง"], hosp: "โรงพยาบาลหาดใหญ่" },
          "อ.เมืองสงขลา": { subdistricts: ["ตำบลบ่อยาง", "ตำบลพะวง", "ตำบลเกาะยอ"], hosp: "โรงพยาบาลสงขลา" },
          "อ.สะเดา": { subdistricts: ["ตำบลสะเดา", "ตำบลปาดังเบซาร์", "ตำบลสำนักขาม"], hosp: "โรงพยาบาลสะเดา" }
        }
      }
    };

    // เพิ่มจังหวัดอื่นๆ พร้อมสร้างอำเภอ ตำบล และ รพ.ประจำอำเภอ อัตโนมัติ
    const otherProvinces = [
      "กระบี่", "กาญจนบุรี", "กาฬสินธุ์", "กำแพงเพชร", "จันทบุรี", "ฉะเชิงเทรา", "ชัยนาท", "ชัยภูมิ", "ชุมพร", "ตรัง", "ตราด", "ตาก", 
      "นครนายก", "นครปฐม", "นครพนม", "นครสวรรค์", "นครศรีธรรมราช", "น่าน", "บึงกาฬ", "บุรีรัมย์", "ประจวบคีรีขันธ์", "ปราจีนบุรี", 
      "ปัตตานี", "พะเยา", "พังงา", "พัทลุง", "พิจิตร", "เพชรบุรี", "เพชรบูรณ์", "แพร่", "มหาสารคาม", "มุกดาหาร", "แม่ฮ่องสอน", 
      "ยโสธร", "ยะลา", "ร้อยเอ็ด", "ระนอง", "ระยอง", "ราชบุรี", "ลพบุรี", "ลำปาง", "ลำพูน", "เลย", "ศรีสะเกษ", "สกลนคร", 
      "สตูล", "สมุทรสงคราม", "สมุทรสาคร", "สระแก้ว", "สระบุรี", "สิงห์บุรี", "สุโขทัย", "สุพรรณบุรี", "สุรินทร์", "หนองคาย", 
      "หนองบัวลำภู", "อ่างทอง", "อำนาจเจริญ", "อุทัยธานี", "อุตรดิตถ์", "อุดรธานี", "เชียงราย", "นนทบุรี", "ปทุมธานี", "สมุทรปราการ", "สุราษฎร์ธานี", "อุบลราชธานี", "ภูเก็ต"
    ];

    otherProvinces.forEach(prov => {
      if (!locationHierarchy[prov]) {
        locationHierarchy[prov] = {
          hospitals: [`โรงพยาบาลศูนย์${prov}`],
          districts: {
            [`อ.เมือง${prov}`]: {
              subdistricts: ["ตำบลในเมือง", "ตำบลรอบนอก", "ตำบลท่าช้าง"],
              hosp: `โรงพยาบาลศูนย์${prov}`
            },
            [`อ.อำเภอที่ 2 (${prov})`]: {
              subdistricts: ["ตำบลในอำเภอ", "ตำบลบ้านใหม่", "ตำบลดอนแก้ว"],
              hosp: `โรงพยาบาลประจำอำเภอที่ 2 (${prov})`
            }
          }
        };
      }
    });

    const firstNames = ["สมชาย", "สมศรี", "วิชัย", "นภา", "กัญญา", "ประเสริฐ", "อารี", "วรรณ", "อนันต์", "สุภาพร", "ธีระ", "พิมล", "ศิริพร", "ณรงค์", "นิตยา"];
    const lastNames = ["ใจดี", "ความสุข", "เด่นดวง", "มีมาก", "รักสงบ", "เจริญพร", "มั่นคง", "งามยิ่ง", "บุญมี", "สุขสันต์"];
    const roles = ["ผู้ช่วยพยาบาล (NA/PN)", "พยาบาลวิชาชีพ (RN)", "บุคคลทั่วไปผ่านการอบรมผู้ดูแล"];
    const avatars = [
      "https://images.unsplash.com/photo-1594824813566-88855ce78961?w=120&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=120&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=120&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=120&auto=format&fit=crop&q=80"
    ];

    let providersDatabase = [];

    // 2. ระบบสร้างข้อมูลผู้ดูแล การันตีอย่างน้อย 5 คนต่อ 1 อำเภอ
    function generateMassiveProviders() {
      let idCounter = 1;

      Object.keys(locationHierarchy).forEach(prov => {
        const provData = locationHierarchy[prov];
        
        Object.keys(provData.districts).forEach(dist => {
          const distData = provData.districts[dist];
          const subdistList = distData.subdistricts;
          const districtHosp = distData.hosp;

          const totalInDistrict = 5 + Math.floor(Math.random() * 4); 

          for (let i = 0; i < totalInDistrict; i++) {
            const fn = firstNames[Math.floor(Math.random() * firstNames.length)];
            const ln = lastNames[Math.floor(Math.random() * lastNames.length)];
            const role = roles[Math.floor(Math.random() * roles.length)];
            const isTransport = Math.random() > 0.4;
            
            const assignedSubdist = subdistList[i % subdistList.length];

            const assignedHosp = (Math.random() > 0.5 && provData.hospitals.length > 0) 
              ? provData.hospitals[Math.floor(Math.random() * provData.hospitals.length)] 
              : districtHosp;

            providersDatabase.push({
              id: idCounter++,
              name: `${fn} ${ln}`,
              role: role,
              license: role.includes("บุคคลทั่วไป") ? "" : `LIC-${100000 + idCounter}`,
              isVerified: true,
              type: isTransport ? "transport" : "overnight",
              typeText: isTransport ? "พาไปโรงพยาบาล" : "เฝ้าไข้นอนโรงพยาบาล",
              price: isTransport ? 600 + (Math.floor(Math.random() * 5) * 100) : 1200 + (Math.floor(Math.random() * 6) * 100),
              province: prov,
              district: dist,
              subdistrict: assignedSubdist,
              hospital: assignedHosp,
              rating: (4.3 + Math.random() * 0.7).toFixed(1),
              img: avatars[Math.floor(Math.random() * avatars.length)]
            });
          }
        });
      });
    }

    let orders = [
      {
        id: "ORD-001",
        providerName: "สมศรี ใจดี",
        service: "พาไปโรงพยาบาล",
        hospital: "โรงพยาบาลพุทธชินราช",
        status: "กำลังเดินทางไปรับ",
        date: "26 ส.ค. 2026"
      }
    ];

    let currentPage = 1;
    const itemsPerPage = 6;
    let currentFilteredData = [];

    document.addEventListener("DOMContentLoaded", () => {
      generateMassiveProviders();
      initProvinceDropdowns();
      filterServices(1);
      renderOrders();
    });

    function initProvinceDropdowns() {
      const searchProvSelect = document.getElementById('search-province');
      const regProvSelect = document.getElementById('reg-province');
      
      const sortedProvinces = Object.keys(locationHierarchy).sort((a, b) => {
        if (a === "กรุงเทพมหานคร") return -1;
        if (b === "กรุงเทพมหานคร") return 1;
        return a.localeCompare(b, 'th');
      });

      sortedProvinces.forEach(prov => {
        const opt1 = document.createElement('option');
        opt1.value = prov;
        opt1.textContent = prov;
        searchProvSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = prov;
        opt2.textContent = prov;
        regProvSelect.appendChild(opt2);
      });
    }

    function onProvinceChange(mode) {
      const provSelect = document.getElementById(mode === 'search' ? 'search-province' : 'reg-province');
      const distSelect = document.getElementById(mode === 'search' ? 'search-district' : 'reg-district');
      const subdistSelect = document.getElementById(mode === 'search' ? 'search-subdistrict' : 'reg-subdistrict');
      const hospSelect = document.getElementById(mode === 'search' ? 'search-hospital' : 'reg-hospital');
      
      const selectedProv = provSelect.value;

      distSelect.innerHTML = mode === 'search' ? '<option value="all">-- ทุกเขต/อำเภอ --</option>' : '<option value="">-- เลือกเขต/อำเภอ --</option>';
      subdistSelect.innerHTML = mode === 'search' ? '<option value="all">-- ทุกแขวง/ตำบล --</option>' : '<option value="">-- เลือกแขวง/ตำบล --</option>';
      hospSelect.innerHTML = mode === 'search' ? '<option value="all">-- ทุกโรงพยาบาล --</option>' : '<option value="">-- เลือกโรงพยาบาล --</option>';

      if (selectedProv && selectedProv !== 'all' && locationHierarchy[selectedProv]) {
        const provData = locationHierarchy[selectedProv];

        Object.keys(provData.districts).forEach(dist => {
          const opt = document.createElement('option');
          opt.value = dist;
          opt.textContent = dist;
          distSelect.appendChild(opt);
        });

        let hospSet = new Set(provData.hospitals);
        Object.values(provData.districts).forEach(d => hospSet.add(d.hosp));

        hospSet.forEach(hosp => {
          const opt = document.createElement('option');
          opt.value = hosp;
          opt.textContent = hosp;
          hospSelect.appendChild(opt);
        });
      }

      if (mode === 'search') filterServices(1);
    }

    function onDistrictChange(mode) {
      const provSelect = document.getElementById(mode === 'search' ? 'search-province' : 'reg-province');
      const distSelect = document.getElementById(mode === 'search' ? 'search-district' : 'reg-district');
      const subdistSelect = document.getElementById(mode === 'search' ? 'search-subdistrict' : 'reg-subdistrict');
      const hospSelect = document.getElementById(mode === 'search' ? 'search-hospital' : 'reg-hospital');

      const selectedProv = provSelect.value;
      const selectedDist = distSelect.value;

      subdistSelect.innerHTML = mode === 'search' ? '<option value="all">-- ทุกแขวง/ตำบล --</option>' : '<option value="">-- เลือกแขวง/ตำบล --</option>';

      if (selectedProv && selectedDist && selectedDist !== 'all' && locationHierarchy[selectedProv]?.districts[selectedDist]) {
        const distData = locationHierarchy[selectedProv].districts[selectedDist];
        
        distData.subdistricts.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          subdistSelect.appendChild(opt);
        });

        if (mode === 'search') {
          hospSelect.innerHTML = '<option value="all">-- ทุกโรงพยาบาล --</option>';
          const provData = locationHierarchy[selectedProv];
          let hospSet = new Set(provData.hospitals);
          hospSet.add(distData.hosp);
          
          hospSet.forEach(hosp => {
            const opt = document.createElement('option');
            opt.value = hosp;
            opt.textContent = hosp;
            if (hosp === distData.hosp) opt.selected = true;
            hospSelect.appendChild(opt);
          });
        }
      }

      if (mode === 'search') filterServices(1);
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      event.target.classList.add('active');
    }

    function renderServiceList(data, page) {
      const listContainer = document.getElementById('service-list');
      const statsInfo = document.getElementById('stats-info');
      const paginationControls = document.getElementById('pagination-controls');
      
      listContainer.innerHTML = '';

      if (data.length === 0) {
        statsInfo.classList.add('hidden');
        paginationControls.classList.add('hidden');
        listContainer.innerHTML = `<div class="card" style="text-align:center; color: var(--text-muted);">ไม่พบผู้ดูแลในพื้นที่หรือเงื่อนไขที่ระบุ</div>`;
        return;
      }

      statsInfo.classList.remove('hidden');
      statsInfo.innerHTML = `พบบุคลากรผู้ดูแลพร้อมให้บริการทั้งสิ้น <strong>${data.length}</strong> ท่าน ในพื้นที่นี้`;

      const totalPages = Math.ceil(data.length / itemsPerPage);
      const startIndex = (page - 1) * itemsPerPage;
      const paginatedData = data.slice(startIndex, startIndex + itemsPerPage);

      paginatedData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card card-interactive';
        card.innerHTML = `
          <div class="provider-header">
            <img src="${item.img}" class="provider-avatar" alt="${item.name}">
            <div class="provider-info">
              <h3>${item.name}</h3>
              <p style="font-size:14px; color:var(--text-muted); margin-bottom: 4px;">${item.role}</p>
              <span class="badge ${item.isVerified ? 'badge-verified' : ''}">
                ${item.isVerified ? '✓ ยืนยันตัวตนแล้ว' : 'รอการตรวจสอบ'}
              </span>
            </div>
          </div>
          
          <div class="provider-details">
            <div class="detail-item"><strong>ประจำพื้นที่:</strong> ${item.subdistrict}, ${item.district}</div>
            <div class="detail-item"><strong>จังหวัด:</strong> ${item.province}</div>
            <div class="detail-item" style="grid-column: 1 / -1;"><strong>โรงพยาบาลประจำ:</strong> ${item.hospital}</div>
            <div class="detail-item"><strong>บริการ:</strong> ${item.typeText}</div>
            <div class="detail-item"><strong>คะแนนรีวิว:</strong> ⭐ ${item.rating} / 5.0</div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:12px; padding-top:12px; border-top:1px solid var(--border-color);">
            <div>
              <span style="font-size:12px; color:var(--text-muted); display:block;">ค่าบริการเริ่มต้น</span>
              <span class="price-tag">${item.price.toLocaleString()}</span> <span style="font-size:14px; color:var(--text-muted);">บาท</span>
            </div>
            <button class="btn" style="width:auto; padding:10px 20px;" onclick="bookService('${item.name}', '${item.typeText}', '${item.hospital}')">จองบริการ (PromptPay)</button>
          </div>
        `;
        listContainer.appendChild(card);
      });

      if (totalPages > 1) {
        paginationControls.classList.remove('hidden');
        paginationControls.innerHTML = `
          <button ${page === 1 ? 'disabled' : ''} onclick="filterServices(${page - 1})">❮ ก่อนหน้า</button>
          <span style="font-size: 14px; color: var(--text-muted);">หน้า ${page} จาก ${totalPages}</span>
          <button ${page === totalPages ? 'disabled' : ''} onclick="filterServices(${page + 1})">ถัดไป ❯</button>
        `;
      } else {
        paginationControls.classList.add('hidden');
      }
    }

    function filterServices(page = 1) {
      currentPage = page;
      document.getElementById('loading').classList.remove('hidden');
      
      setTimeout(() => {
        const prov = document.getElementById('search-province').value;
        const dist = document.getElementById('search-district').value;
        const subdist = document.getElementById('search-subdistrict').value;
        const hosp = document.getElementById('search-hospital').value;
        const type = document.getElementById('service-type').value;

        currentFilteredData = providersDatabase.filter(item => {
          const matchProv = (prov === 'all') || (item.province === prov);
          const matchDist = (dist === 'all') || (item.district === dist);
          const matchSub = (subdist === 'all') || (item.subdistrict === subdist);
          const matchHosp = (hosp === 'all') || (item.hospital === hosp);
          const matchType = (type === 'all') || (item.type === type);
          return matchProv && matchDist && matchSub && matchHosp && matchType;
        });

        renderServiceList(currentFilteredData, currentPage);
        document.getElementById('loading').classList.add('hidden');
      }, 200);
    }

    function bookService(providerName, serviceType, hospital) {
      const confirmBooking = confirm(`ยืนยันการจองบริการกับ ${providerName}\nบริการ: ${serviceType}\nโรงพยาบาล: ${hospital}\n\nระบบจะทำการสแกน PromptPay เพื่อชำระเงิน`);
      if (confirmBooking) {
        const newOrder = {
          id: `ORD-00${orders.length + 1}`,
          providerName: providerName,
          service: serviceType,
          hospital: hospital,
          status: "ยืนยันการชำระเงินแล้ว",
          date: new Date().toLocaleDateString('th-TH')
        };
        orders.unshift(newOrder);
        alert("ชำระเงินสำเร็จ! ผู้ดูแลได้รับการยืนยันเรียบร้อยแล้ว");
        renderOrders();
        switchTab('orders');
      }
    }

    function renderOrders() {
      const ordersContainer = document.getElementById('orders-list');
      ordersContainer.innerHTML = '';

      if (orders.length === 0) {
        ordersContainer.innerHTML = `<div class="card"><p style="text-align:center; color: var(--text-muted);">ยังไม่มีรายการจอง</p></div>`;
        return;
      }

      orders.forEach(ord => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
            <span style="font-size:13px; font-weight:600; color:var(--text-muted);">รหัสการจอง: ${ord.id}</span>
            <span style="font-size:13px; color:var(--text-muted);">${ord.date}</span>
          </div>
          <h3 style="margin-bottom: 8px;">ผู้ดูแล: ${ord.providerName}</h3>
          <p style="font-size:15px;"><strong>บริการ:</strong> ${ord.service}</p>
          <p style="font-size:15px;"><strong>โรงพยาบาล:</strong> ${ord.hospital}</p>
          
          <div class="status-box">
            <span>สถานะปัจจุบัน</span>
            <span style="color:var(--primary-color);">${ord.status}</span>
          </div>
          <button class="btn btn-secondary" style="margin-top:16px;" onclick="updateOrderStatus('${ord.id}')">จำลอง: อัปเดตสถานะฝั่งผู้ดูแล</button>
        `;
        ordersContainer.appendChild(card);
      });
    }

    function updateOrderStatus(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (order) {
        const statuses = ["ยืนยันการชำระเงินแล้ว", "กำลังเดินทางไปรับ", "ถึงโรงพยาบาลแล้ว", "กำลังดูแลระหว่างพบแพทย์", "ส่งกลับบ้านเรียบร้อย/เสร็จสิ้น"];
        let nextIndex = statuses.indexOf(order.status) + 1;
        if (nextIndex >= statuses.length) nextIndex = 0;
        order.status = statuses[nextIndex];
        renderOrders();
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('p-name').value;
      const role = document.getElementById('p-role').value;
      const license = document.getElementById('p-license').value;
      const province = document.getElementById('reg-province').value;
      const district = document.getElementById('reg-district').value;
      const subdistrict = document.getElementById('reg-subdistrict').value;
      const hospital = document.getElementById('reg-hospital').value;
      const service = document.getElementById('p-service').value;
      const price = document.getElementById('p-price').value;

      const newProvider = {
        id: providersDatabase.length + 1,
        name: name,
        role: role,
        license: license,
        isVerified: license.length > 0,
        province: province,
        district: district,
        subdistrict: subdistrict,
        hospital: hospital,
        type: service === 'both' ? 'transport' : service,
        typeText: service === 'overnight' ? 'เฝ้าไข้นอนโรงพยาบาล' : 'พาไปโรงพยาบาล',
        price: Number(price),
        rating: "5.0",
        img: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120&auto=format&fit=crop&q=80"
      };

      providersDatabase.unshift(newProvider);
      alert("ลงทะเบียนสำเร็จ! ระบบบันทึกข้อมูลบริการของคุณเรียบร้อยแล้ว");
      document.getElementById('provider-form').reset();
      filterServices(1);
      switchTab('search');
    }
  </script>
</body>
</html>
